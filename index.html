<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Terverifikasi | BarFin</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(135deg,#3B82F6,#4F46E5);padding:20px}
  .card{background:#fff;border-radius:20px;max-width:420px;width:100%;
    padding:36px 28px;text-align:center;box-shadow:0 20px 50px rgba(30,58,138,.3)}
  .icon{width:72px;height:72px;border-radius:22px;margin:0 auto 20px;
    background:linear-gradient(135deg,#3B82F6,#4F46E5);display:flex;
    align-items:center;justify-content:center}
  .icon svg{width:38px;height:38px}
  h1{font-size:22px;color:#172033;margin-bottom:12px}
  p{font-size:15px;line-height:1.6;color:#475569}
  .note{margin-top:20px;font-size:13px;color:#64748B}
  footer{margin-top:28px;font-size:12px;color:#94A3B8}
</style>
</head>
<body>
  <main class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
    </div>
    <h1>Email berhasil diverifikasi</h1>
    <p>Akun BarFin kamu sudah aktif. Silakan kembali ke aplikasi BarFin, lalu masuk dengan email dan password yang kamu daftarkan.</p>
    <p class="note">Kamu bisa menutup halaman ini.</p>
    <footer>© 2026 BarFin • Created by Albar Syahrurrachman</footer>
  </main>
</body>
</html>
